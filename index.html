<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>모바일 UX/UI 프로젝트 진행 현황 — 업무 인수인계</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>

  <header class="page-header">
    <div class="container">
      <p class="eyebrow">업무 인수인계</p>
      <h1 class="page-title">모바일 UX/UI 프로젝트 진행 현황</h1>
      <p class="page-desc">최근 프로젝트를 기준으로 진행상태와 Figma·일감·프로토타입·관련 문서를 연결한 인수인계용 작업 인덱스입니다.</p>
      <dl class="meta-list">
        <div class="meta-item"><dt>최종 업데이트</dt><dd>2026.08.13</dd></div>
        <div class="meta-item"><dt>작성자</dt><dd>한일환</dd></div>
        <div class="meta-item"><dt>조직</dt><dd>모바일AI서비스팀</dd></div>
        <div class="meta-item"><dt>문서 성격</dt><dd>사내 업무 인수인계 자료</dd></div>
      </dl>
    </div>
  </header>

  <div class="container">
    <section class="summary" aria-label="상태 요약">
      <ul class="summary-list" id="summaryList"></ul>
    </section>

    <aside class="guide-box" aria-label="문서 사용 기준" id="guideBox">
      <h2 class="guide-title" id="guideTitle"></h2>
      <ol class="guide-steps" id="guideSteps"></ol>
      <p class="guide-note" id="guideNote"></p>
    </aside>

    <section class="filters" aria-label="필터">
      <div class="filter-group" role="group" aria-label="상태 필터" id="statusFilters">
        <button type="button" class="filter-btn is-active" data-status="all" aria-pressed="true">전체</button>
        <button type="button" class="filter-btn" data-status="디자인 완료" aria-pressed="false">디자인 완료</button>
        <button type="button" class="filter-btn" data-status="반영 완료" aria-pressed="false">반영 완료</button>
        <button type="button" class="filter-btn" data-status="hold-check" aria-pressed="false">홀딩·확인 필요</button>
      </div>
    </section>

    <div class="layout">
      <nav class="side-nav" aria-label="프로젝트 목록">
        <ul id="sideNavList"></ul>
      </nav>
      <main id="main" class="card-list-wrap">
        <div id="cardList" class="card-list"></div>
        <p id="emptyMessage" class="empty-message" hidden>선택한 필터에 해당하는 프로젝트가 없습니다.</p>
        <section class="pending-box" aria-label="추가 입력이 필요한 항목">
          <h2 class="guide-title">추가 입력이 필요한 항목</h2>
          <ul class="pending-list" id="pendingList"></ul>
        </section>
      </main>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden>프로젝트 링크를 복사했습니다.</div>

  <script src="data/projects.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
